<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Road to nationals</title>
<meta name="description" content="1500m training, strength, stretching and skincare in one daily tracker.">
<meta name="theme-color" content="#070b1a" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#eef2fb" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nationals">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="ambient" aria-hidden="true"><i></i><i></i><i></i></div>
<main>
  <section class="top glass">
    <div>
      <h1 id="title">Today</h1>
      <p id="subtitle"></p>
    </div>
    <button class="acct" id="acctBtn" aria-label="Account"><span id="acctInitial">?</span></button>
    <div class="ring" aria-hidden="true">
      <svg width="74" height="74" viewBox="0 0 74 74">
        <circle cx="37" cy="37" r="31" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="8"/>
        <circle id="arc" cx="37" cy="37" r="31" fill="none" stroke="var(--accent)" stroke-width="8" stroke-linecap="round" stroke-dasharray="194.8" stroke-dashoffset="194.8" style="transition:stroke-dashoffset .5s"/>
      </svg>
      <div class="v" id="ringv">0%</div>
    </div>
  </section>
  <p class="syncpill" id="syncPill" hidden></p>
  <div id="view"></div>
</main>

<nav class="dock glass" aria-label="Sections">
  <button data-tab="daily"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Daily</button>
  <button data-tab="run"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="14" cy="4" r="2"/><path d="M8 21l3-6 3 2v5M6 12l3-3 4 1 3 3 3 1"/></svg>Run</button>
  <button data-tab="strength"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Strength</button>
  <button data-tab="skin"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c3 4 6 7 6 11a6 6 0 0 1-12 0c0-4 3-7 6-11z"/></svg>Skin</button>
  <button data-tab="moves"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-3-6.2"/><path d="M17 2v4h4"/></svg>Moves</button>
  <button data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19l5-6 4 3 7-9"/></svg>Progress</button>
</nav>

<div class="sheet" id="authSheet" hidden>
  <form class="card glass authbox" id="authForm">
    <h2 id="authTitle">Sign in</h2>
    <p class="sub" id="authSub">Your training saves to the cloud, so it follows you to any device.</p>
    <div class="field"><label for="authEmail">Email</label><input id="authEmail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="authPass">Password</label><input id="authPass" type="password" autocomplete="current-password" minlength="8" required></div>
    <p class="err" id="authErr"></p>
    <button class="btn primary wide" id="authGo">Sign in</button>
    <p class="foot"><button type="button" class="link" id="authSwap">Create an account instead</button></p>
    <p class="foot"><button type="button" class="link" id="authSkip">Use it on this device only</button></p>
  </form>
</div>

<div class="sheet" id="acctSheet" hidden>
  <div class="card glass authbox">
    <h2>Account</h2>
    <p class="sub" id="acctWho"></p>
    <div class="actions">
      <button class="btn" id="acctSync">Sync now</button>
      <button class="btn" id="acctOut">Sign out</button>
      <button class="btn primary" id="acctClose">Done</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" defer></script>
<script src="sync.js" defer></script>
<script src="app.js" defer></script>
</body>
</html>
